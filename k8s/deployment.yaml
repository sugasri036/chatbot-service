
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-service
  namespace: investra
  labels:
    app: chatbot-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: chatbot-service

  template:
    metadata:
      labels:
        app: chatbot-service

    spec:
      containers:
        - name: chatbot-service
          image: sugasri3/investra-chatbot-service:1.0.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              name: http

          envFrom:
            - configMapRef:
                name: chatbot-config
            - secretRef:
                name: chatbot-secrets

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
